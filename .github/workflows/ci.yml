name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        java-version: [11, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Install Leiningen
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          lein: latest

      - name: Cache Maven and Leiningen state
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.lein
          key: ${{ runner.os }}-lein-${{ matrix.java-version }}-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-lein-${{ matrix.java-version }}-
            ${{ runner.os }}-lein-

      - name: lein check
        run: lein check

      - name: lein test
        run: lein test
