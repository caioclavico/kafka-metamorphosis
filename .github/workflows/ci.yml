name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        java-version: [11, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Install Leiningen
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          lein: latest

      - name: Cache Maven and Leiningen state
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.lein
          key: ${{ runner.os }}-lein-${{ matrix.java-version }}-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-lein-${{ matrix.java-version }}-
            ${{ runner.os }}-lein-

      - name: lein check
        run: lein check

      - name: lein test
        run: lein test :default

  integration:
    needs: build
    runs-on: ubuntu-latest
    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Leiningen
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          lein: latest

      - name: Cache Maven and Leiningen state
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.lein
          key: ${{ runner.os }}-lein-21-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-lein-21-
            ${{ runner.os }}-lein-

      - name: Wait for Kafka to become available
        run: |
          for i in $(seq 1 30); do
            if bash -c '</dev/tcp/localhost/9092'; then
              echo "Kafka is available"
              exit 0
            fi
            sleep 5
          done
          echo "Kafka did not become available" >&2
          exit 1

      - name: Run integration tests
        run: lein test test/kafka_metamorphosis/integration_test.clj
